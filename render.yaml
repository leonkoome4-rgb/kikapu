services:
  - type: web
    name: kikapu-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && FLASK_APP=wsgi.py flask db upgrade
    startCommand: gunicorn wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: kikapu-db
          property: connectionString
      - key: SMS_PROVIDER
        value: console
      - key: EMAIL_PROVIDER
        value: console
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false

databases:
  - name: kikapu-db
    plan: free
